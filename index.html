<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Pre-visualización</title>
<style>
 body{font-family:sans-serif;background:#f7f7f7;margin:0;padding:2rem}
 .box{background:#fff;max-width:780px;margin:auto;padding:2rem;border-radius:10px;box-shadow:0 0 15px rgba(0,0,0,.1)}
 img{max-width:100%;border-radius:8px;margin-top:1rem}
 .btn{display:inline-block;margin:1rem .5rem;padding:.6rem 1.4rem;border:0;border-radius:6px;font-weight:bold;color:#fff;cursor:pointer}
 .ok{background:#28a745}.ko{background:#dc3545}
</style>
</head>
<body>
<div class="box">
  <h1>Pre-visualización</h1>
  <p id="texto"></p>
  <img id="img" />
  <div>
    <button class="btn ok" onclick="decidir('publicar')">✅ Publicar</button>
    <button class="btn ko" onclick="decidir('cancelar')">❌ Cancelar</button>
  </div>
</div>

<script>
 // Rellenamos texto + imagen
 document.getElementById('texto').textContent = "{{ $json.texto }}";
 document.getElementById('img').src = "{{ $json.url }}";

 // Lanza la decisión al webhook de confirmación
 function decidir(accion){
   fetch("{{ $env.confirmWebhook }}",{
     method:"POST",
     headers:{ "Content-Type":"application/json" },
     body:JSON.stringify({ accion, imagen:"{{ $json.fileName }}" })
   }).then(()=> window.close());
 }
</script>
</body>
</html>
