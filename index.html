<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Previsualización de la publicación</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f9f9f9;
      padding: 2em;
      text-align: center;
    }
    .card {
      background: white;
      padding: 2em;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      max-width: 600px;
      margin: auto;
    }
    img {
      max-width: 100%;
      border-radius: 8px;
    }
    button {
      margin: 1em;
      padding: 0.7em 2em;
      border: none;
      border-radius: 5px;
      font-size: 1em;
      cursor: pointer;
    }
    .publicar {
      background-color: #28a745;
      color: white;
    }
    .cancelar {
      background-color: #dc3545;
      color: white;
    }
    #spinner {
      display: none;
      margin-top: 1em;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>¿Quieres publicar esto en LinkedIn?</h2>
    <p>{{ $json.texto }}</p>
    <img src="{{ $json.urlPrevisualizacion }}" alt="Imagen de la publicación">

    <div>
      <button class="publicar" onclick="responder('publicar')">Publicar</button>
      <button class="cancelar" onclick="responder('cancelar')">Cancelar</button>
      <div id="spinner">⏳ Procesando...</div>
    </div>
  </div>

  <script>
    function responder(accion) {
      document.querySelectorAll("button").forEach(b => b.disabled = true);
      document.getElementById("spinner").style.display = "block";

      fetch("{{ $execution.resumeUrl }}", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          accion: accion,
          texto: "{{ $json.texto }}",
          imagen: "{{ $json.fileName }}"
        })
      }).then(() => {
        document.getElementById("spinner").innerText = "✅ ¡Respuesta enviada!";
      }).catch(() => {
        document.getElementById("spinner").innerText = "❌ Error al enviar";
      });
    }
  </script>
</body>
</html>
